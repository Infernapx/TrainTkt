<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Train | National Ticket Booking Spot</title>
<link rel="stylesheet" th:href="@{/UserHome_Css.css}">
</head>
<body>
	<header>
		<h1 class="hd">National Ticket Booking Spot &nbsp;<span style="font-size: 13px; font-weight: 700; color: #f43f5e; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); padding: 4px 10px; border-radius: 9999px;">Admin Portal</span></h1>
		<div style="display: flex; flex-wrap: wrap; gap: 8px;">
			<div class="home"><p class="menu"><a th:href="@{/adminhome}">Home</a></p></div>
			<div class="home"><p class="menu"><a th:href="@{/adminviewtrainfwd}">View Trains</a></p></div>
			<div class="home"><p class="menu"><a th:href="@{/addtrainfwd}">Add Train</a></p></div>
			<div class="home"><p class="menu"><a th:href="@{/cancletrainfwd}">Delete Train</a></p></div>
			<div class="home"><p class="menu"><a th:href="@{/updatetrain}">Update Train</a></p></div>
			<div class="home"><p class="menu"><a th:href="@{/userlogout}" style="color: #f43f5e;">Logout</a></p></div>
		</div>
	</header>

	<div class="tab">
		<h2 style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 8px;">Update Train Fares & Seat Quota</h2>
		<p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Adjust seat allocations and ticket pricing for any existing train in PostgreSQL.</p>

		<form th:action="@{/updatetrain}" method="post">
			<div class="form-group">
				<label class="form-label">Train Number</label>
				<input type="number" name="trainno" placeholder="Enter train number (e.g. 12367)" required>
			</div>

			<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
				<div class="form-group">
					<label class="form-label">Updated Seat Capacity</label>
					<input type="number" name="seats" placeholder="New seat quota" min="0" required>
				</div>
				<div class="form-group">
					<label class="form-label">Updated Base Fare (₹)</label>
					<input type="number" step="0.5" name="fare" placeholder="New fare" required>
				</div>
			</div>

			<input type="submit" value="Save Schedule Changes">
		</form>
	</div>

	<footer>
		<p>© 2026 National Ticket Booking Spot. Railway Administration System.</p>
	</footer>
</body>
</html>
