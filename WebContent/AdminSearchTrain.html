<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Search Train | National Ticket Booking Spot</title>
<link rel="stylesheet" href="UserHome_Css.css">
</head>
<body>
	<header>
		<h1 class="hd">National Ticket Booking Spot &nbsp;<span style="font-size: 13px; font-weight: 700; color: #dc2626; background: #fee2e2; padding: 4px 10px; border-radius: 9999px;">Admin Portal</span></h1>
		<div style="display: flex; flex-wrap: wrap; gap: 8px;">
			<div class="home"><p class="menu"><a href="AdminHome.html">Home</a></p></div>
			<div class="home"><p class="menu"><a href="adminviewtrainfwd">View Trains</a></p></div>
			<div class="home"><p class="menu"><a href="adminsearchtrainfwd">Search by TrainNo</a></p></div>
			<div class="home"><p class="menu"><a href="addtrainfwd">Add Train</a></p></div>
			<div class="home"><p class="menu"><a href="cancletrainfwd">Delete Train</a></p></div>
			<div class="home"><p class="menu"><a href="updatetrain">Update Train</a></p></div>
			<div class="home"><p class="menu"><a href="adminlogout" style="color: #dc2626;">Logout</a></p></div>
		</div>
	</header>

	<div class="tab">
		<h2 style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 8px;">Search Train by Number</h2>
		<p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Inspect details and live status of a train by number or train name.</p>

		<form id="adminSearchTrainForm" action="adminsearchtrain" method="post">
			<div class="form-group">
				<label class="form-label" for="trainnumber">Train Number or Name</label>
				<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
					<input type="text" id="trainnumber" name="trainnumber" placeholder="Enter train number or name (e.g. 12367, 10001)" style="max-width: 360px;" required autocomplete="off">
					<button type="submit" style="margin-top: 0; padding: 11px 26px; background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%); color: #fff; font-weight: 700; border: none; border-radius: var(--radius-sm); cursor: pointer; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);">SEARCH TRAIN</button>
				</div>
				<div style="margin-top: 12px; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
					<span style="font-weight: 600;">Quick Try:</span>
					<button type="button" onclick="adminQuickSearch('12367')" class="quick-link-pill">12367 (Vikramshila Exp)</button>
					<button type="button" onclick="adminQuickSearch('10001')" class="quick-link-pill">10001 (Jodhpur Exp)</button>
					<button type="button" onclick="adminQuickSearch('10002')" class="quick-link-pill">10002 (Yamuna Exp)</button>
					<button type="button" onclick="adminQuickSearch('10103')" class="quick-link-pill">10103 (Mahabodhi Exp)</button>
				</div>
			</div>
		</form>

		<div id="adminSearchResultsArea" class="search-results-wrapper" style="display: none;"></div>
	</div>

	<script>
		function adminQuickSearch(trainNo) {
			document.getElementById('trainnumber').value = trainNo;
			doAdminSearch();
		}

		async function doAdminSearch() {
			const input = document.getElementById('trainnumber');
			const trainNo = input.value.trim();
			if (!trainNo) {
				input.focus();
				return;
			}

			const resultsArea = document.getElementById('adminSearchResultsArea');
			resultsArea.style.display = 'block';
			resultsArea.innerHTML = `
				<div style="display:flex; align-items:center; justify-content:center; gap:12px; padding:28px 16px; color:#64748b; font-weight:600;">
					<div style="width:22px; height:22px; border:3px solid #e2e8f0; border-top-color:#1d4ed8; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
					<span>Searching train records for #${trainNo}...</span>
				</div>
				<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
			`;

			try {
				const formData = new URLSearchParams();
				formData.append('trainnumber', trainNo);
				formData.append('ajax', 'true');

				const response = await fetch('adminsearchtrain', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/x-www-form-urlencoded',
						'X-Requested-With': 'XMLHttpRequest'
					},
					body: formData.toString()
				});

				if (response.ok) {
					const html = await response.text();
					resultsArea.innerHTML = html;
				} else {
					resultsArea.innerHTML = `
						<div class="alert-card-danger">
							<div class="alert-card-icon">&#9888;</div>
							<div>
								<div class="alert-card-title">Search Failed</div>
								<div class="alert-card-desc">Server returned error (${response.status}). Please try again.</div>
							</div>
						</div>
					`;
				}
			} catch (err) {
				resultsArea.innerHTML = `
					<div class="alert-card-danger">
						<div class="alert-card-icon">&#9888;</div>
						<div>
							<div class="alert-card-title">Network Error</div>
							<div class="alert-card-desc">Unable to reach system. Check connection and retry.</div>
						</div>
					</div>
				`;
			}
		}

		document.getElementById('adminSearchTrainForm').addEventListener('submit', function(e) {
			e.preventDefault();
			doAdminSearch();
		});
	</script>
</body>
</html>
