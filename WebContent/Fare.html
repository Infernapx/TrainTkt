<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare Enquiry | National Ticket Booking Spot</title>
<link rel="stylesheet" href="UserHome_Css.css">
</head>
<body>
	<header>
		<h1 class="hd">National Ticket Booking Spot</h1>
		<div style="display: flex; flex-wrap: wrap; gap: 8px;">
			<div class="home"><p class="menu"><a href="userhome">Home</a></p></div>
			<div class="home"><p class="menu"><a href="userviewtrainfwd">View Trains</a></p></div>
			<div class="home"><p class="menu"><a href="trainbwstnfwd">Trains Between Stations</a></p></div>
			<div class="home"><p class="menu"><a href="bookingdetails">Booking History</a></p></div>
			<div class="home"><p class="menu"><a href="fareenqfwd">Fare Enquiry</a></p></div>
			<div class="home"><p class="menu"><a href="useravailfwd">Seat Availability</a></p></div>
			<div class="home"><p class="menu"><a href="usersearchtrain">Search by TrainNo</a></p></div>
			<div class="home"><p class="menu"><a href="userprofile">Profile</a></p></div>
			<div class="home"><p class="menu"><a href="userlogout" style="color: #dc2626;">Logout</a></p></div>
		</div>
	</header>

	<div class="tab">
		<h2 style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 8px;">Fare Enquiry Between Stations</h2>
		<p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Calculate travel costs and ticket fares across different routes.</p>

		<form action="fareenq" method="post">
			<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
				<div class="form-group">
					<label class="form-label">Boarding Station</label>
					<input type="text" name="fromstation" placeholder="e.g. HOWRAH, GAYA, PATNA" required>
				</div>
				<div class="form-group">
					<label class="form-label">Destination Station</label>
					<input type="text" name="tostation" placeholder="e.g. JODHPUR, DELHI, RANCHI" required>
				</div>
			</div>

			<input type="submit" value="Calculate Fare">
		</form>
	</div>
</body>
</html>
